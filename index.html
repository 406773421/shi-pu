<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大宝贝儿的食谱</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111;background:#f5f5f5}
  .app-wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:80px;background:#fff}
  .app-header{text-align:center;padding:16px 0 12px;font-size:18px;font-weight:600}
  .toolbar{display:flex;align-items:center;gap:8px;padding:0 16px 12px}
  .search-box{flex:1;display:flex;align-items:center;gap:8px;background:#f5f5f5;border-radius:20px;padding:8px 14px}
  .search-box input{border:none;background:transparent;outline:none;font-size:15px;width:100%;color:#111;font-family:inherit}
  .search-box input::placeholder{color:#999}
  .btn{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:opacity .15s;font-family:inherit}
  .btn:hover{opacity:.8}
  .btn-outline{background:#fff;color:#111;border-color:#e0e0e0}
  .btn-primary{background:#111;color:#fff;border-color:#111}
  .btn-danger{background:#e74c3c;color:#fff;border-color:#e74c3c}
  .main{display:flex}
  .sidebar{width:90px;background:#f8f8f8;position:sticky;top:0;align-self:flex-start;height:fit-content}
  .cat-item{padding:14px 6px;text-align:center;font-size:13px;cursor:pointer;position:relative;color:#666;transition:all .15s;line-height:1.3}
  .cat-item.active{background:#fff;color:#111;font-weight:500}
  .cat-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#111;border-radius:0 2px 2px 0}
  .cat-icon{font-size:18px;display:block;margin-bottom:4px}
  .menu{flex:1;padding:0 16px 16px;min-width:0}
  .cat-title{font-size:16px;font-weight:500;padding:12px 0 8px;display:flex;align-items:center;gap:4px;position:sticky;top:0;background:#fff;z-index:2}
  .dish{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee;align-items:center;cursor:pointer}
  .dish-img{width:76px;height:76px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f0f0f0}
  .dish-info{flex:1;min-width:0;pointer-events:none}
  .dish-name{font-size:15px;font-weight:500;margin-bottom:6px}
  .dish-sub{font-size:12px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .preg-badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-top:4px;font-weight:500}
  .preg-x{background:#fdecea;color:#e74c3c}
  .preg-star{background:#fff8e1;color:#e67e22}
  .preg-note{font-size:12px;color:#999;text-align:center;margin-top:14px;line-height:1.6}
  .guide-card{background:#f8f8f8;border-radius:12px;padding:16px;margin:12px 0}
  .guide-title{font-size:15px;font-weight:600;margin-bottom:10px}
  .guide-sub{font-size:13px;font-weight:600;color:#333;margin:10px 0 4px}
  .guide-item{font-size:13px;color:#555;line-height:1.7}
  .guide-warn{color:#c0392b}
  .dish-actions{display:flex;align-items:center;gap:6px}
  .qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111;padding:0}
  .qty-btn.add{background:#111;color:#fff;border-color:#111}
  .qty{font-size:14px;font-weight:500;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .del-btn{width:30px;height:30px;border-radius:8px;border:none;background:#fdecea;color:#e74c3c;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;padding:0}
  .cart-bar{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);z-index:20}
  .cart-icon{position:relative;color:#111;display:flex}
  .cart-badge{position:absolute;top:-5px;right:-5px;background:#e74c3c;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:500}
  .cart-info{flex:1;font-size:14px;color:#999}
  .cart-total{font-weight:500;color:#111}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:20}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#999;background:none;border:none;cursor:pointer;position:relative;padding:4px 12px;font-family:inherit}
  .tab.active{color:#111}
  .tab-badge{position:absolute;top:0;right:6px;background:#e74c3c;color:#fff;font-size:10px;padding:0 5px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:500}
  .empty-state{text-align:center;padding:40px 20px;color:#999;font-size:14px}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.show{display:flex}
  .modal-content{background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;position:relative}
  .modal-header{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .modal-title{font-size:18px;font-weight:600}
  .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f5f5f5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
  .modal-body{padding:0 20px 20px}
  .modal-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:12px;margin:16px 0}
  .modal-section{margin-bottom:20px}
  .modal-section-title{font-size:15px;font-weight:600;margin-bottom:10px;color:#333}
  .modal-ingredients{font-size:14px;line-height:1.6;color:#555;background:#f8f8f8;padding:12px 16px;border-radius:10px}
  .modal-step{display:flex;gap:12px;margin-bottom:14px;font-size:14px;line-height:1.6;color:#444}
  .modal-step-num{width:24px;height:24px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
  .modal-footer{position:sticky;bottom:0;background:#fff;padding:12px 20px 20px;border-top:1px solid #eee;display:flex;gap:12px;align-items:center}
  .form-group{margin-bottom:14px}
  .form-label{font-size:13px;font-weight:500;color:#333;margin-bottom:6px;display:block}
  .form-input,.form-select,.form-textarea{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;color:#111;outline:none;background:#fff}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#111}
  .form-textarea{resize:vertical;min-height:70px;line-height:1.5}
  .form-hint{font-size:12px;color:#999;margin-top:4px}
  .me-page{padding:0 16px 16px}
  .me-card{background:#f8f8f8;border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
  .me-avatar{font-size:48px;margin-bottom:8px}
  .me-name{font-size:17px;font-weight:600}
  .me-stats{display:flex;gap:12px;margin-bottom:16px}
  .me-stat{flex:1;background:#f8f8f8;border-radius:12px;padding:16px 8px;text-align:center}
  .me-stat-num{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .me-stat-label{font-size:12px;color:#999;margin-top:4px}
  .me-actions{display:flex;flex-direction:column;gap:10px}
  .me-actions .btn{width:100%;padding:12px}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="app-header">大宝贝儿的食谱</div>

  <div id="menuView">
    <div class="toolbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:#999;flex-shrink:0">
          <path d="M11.5 3C16.1944 3 20 6.80558 20 11.5C20 13.523 19.2933 15.381 18.1132 16.8404L21.1364 19.8636C21.4879 20.2151 21.4879 20.7849 21.1364 21.1364C20.7849 21.4879 20.2151 21.4879 19.8636 21.1364L16.8404 18.1132C15.381 19.2933 13.523 20 11.5 20C6.80558 20 3 16.1944 3 11.5C3 6.80558 6.80558 3 11.5 3ZM11.5 18.2C15.2003 18.2 18.2 15.2003 18.2 11.5C18.2 7.79969 15.2003 4.8 11.5 4.8C7.79969 4.8 4.8 7.79969 4.8 11.5C4.8 15.2003 7.79969 18.2 11.5 18.2Z" fill="currentColor"/>
        </svg>
        <input type="text" placeholder="搜索" id="searchInput">
      </div>
      <button class="btn btn-outline" id="manageBtn">管理菜谱</button>
      <button class="btn btn-primary" id="addBtn">添加菜谱</button>
    </div>
    <div class="main">
      <aside class="sidebar" id="sidebar"></aside>
      <section class="menu" id="menu"></section>
    </div>
  </div>

  <div id="cartView" style="display:none;padding:0 16px 16px">
    <div id="cartList"></div>
  </div>

  <div id="meView" class="me-page" style="display:none">
    <div class="me-card">
      <div class="me-avatar">👶</div>
      <div class="me-name">大宝贝儿</div>
    </div>
    <div class="me-stats">
      <div class="me-stat"><div class="me-stat-num" id="statDishes">0</div><div class="me-stat-label">收录菜品</div></div>
      <div class="me-stat"><div class="me-stat-num" id="statCats">0</div><div class="me-stat-label">分类</div></div>
      <div class="me-stat"><div class="me-stat-num" id="statCart">0</div><div class="me-stat-label">已点份数</div></div>
    </div>
    <div class="me-actions">
      <button class="btn btn-outline" onclick="clearCart()">清空购物车</button>
      <button class="btn btn-outline" onclick="resetData()">恢复默认菜谱</button>
    </div>
    <div class="preg-note">评级按孕早期（5周+）+ 多囊控糖口径：✗ 禁止食用 ｜ ★ 偶尔可吃 ｜ ★★ 比较推荐 ｜ ★★★ 推荐 ｜ ★★★★ 强烈推荐 ｜ ★★★★★ 必须补充<br>已考虑酒精、生食/半生食、活血食材（山楂/当归等）、腌制加工食品、动物内脏（维生素A）、皮蛋含铅、咖啡因、高升糖等因素，仅供参考，具体请遵医嘱</div>
  </div>

  <nav class="tab-bar">
    <button class="tab active" data-view="menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>点菜</span>
    </button>
    <button class="tab" data-view="cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2 12h12l2-9H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="10" cy="19" r="1.5" fill="currentColor"/><circle cx="18" cy="19" r="1.5" fill="currentColor"/></svg>
      <span>购物车</span>
      <span class="tab-badge" id="cartTabBadge" style="display:none">0</span>
    </button>
    <button class="tab" data-view="me">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeDetail(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">菜品详情</div>
      <button class="modal-close" onclick="closeDetail()">&#10005;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <div style="flex:1;font-size:14px;color:#999">选好数量后点击加入购物车</div>
      <button class="btn btn-primary" onclick="modalAdd()">加入购物车</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addOverlay" onclick="closeAdd(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">添加菜谱</div>
      <button class="modal-close" onclick="closeAdd()">&#10005;</button>
    </div>
    <div class="modal-body" style="padding-top:16px">
      <div class="form-group">
        <label class="form-label">菜名</label>
        <input class="form-input" id="addName" placeholder="例如：麻婆豆腐">
      </div>
      <div class="form-group">
        <label class="form-label">分类</label>
        <select class="form-select" id="addCat"></select>
      </div>
      <div class="form-group">
        <label class="form-label">食材</label>
        <textarea class="form-textarea" id="addIngredients" placeholder="例如：嫩豆腐1盒、牛肉末100g、豆瓣酱"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">做法步骤</label>
        <textarea class="form-textarea" id="addSteps" style="min-height:110px" placeholder="每行写一步"></textarea>
        <div class="form-hint">每行一步，保存后自动编号</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeAdd()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveDish()">保存菜谱</button>
    </div>
  </div>
</div>

function initSync(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  if(typeof supabase === "undefined") return;
  try{
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    supabaseClient.from("shared_menu").select("data").eq("id", SHARED_ROW_ID).single()

        if(res.data && res.data.data && res.data.data.dishes){
          dishesData = res.data.data.dishes;
          saveLocal();
          renderCategories(); renderDishes(); updateCart();
        }else{
          pushRemote();  // 云端为空：把当前数据推上去
        }
      });
    supabaseClient.channel("menu-sync")
      .on("postgres_changes", {event:"*", schema:"public", table:"shared_menu"}, function(payload){
        var remote = payload && payload.new && payload.new.data;
        if(remote && remote.dishes && JSON.stringify(remote.dishes) !== JSON.stringify(dishesData)){
          dishesData = remote.dishes;
          saveLocal();

        }
      })
      .subscribe();
  }catch(e){}
}

}

    dishes = filtered;
  }
  dishes = dishes.slice().sort(function(a,b){
    var pa = (a.preg===undefined||a.preg===null) ? -1 : a.preg;
    var pb = (b.preg===undefined||b.preg===null) ? -1 : b.preg;
    return pb - pa;
  });
  if(!dishes.length){
    menuEl.innerHTML = '<div class="empty-state">暂无菜品</div>';
    return;
  }
  var titleHtml = '<div class="cat-title">'+cat.name+' '+cat.icon+' <span style="color:#999;font-weight:400">('+dishes.length+')</span></div>';
  var dishesHtml = "";
  for(var i=0;i<dishes.length;i++){
    var dish = dishes[i];
    var qty = state.cart[dish.id] || 0;
    var subHtml = dish.ingredients ? '<div class="dish-sub">'+dish.ingredients+'</div>' : '';
    var actionHtml = "";
    if(state.managing){
      actionHtml = '<button class="del-btn" onclick="event.stopPropagation();deleteDish(\''+dish.id+'\')" title="删除">🗑</button>';
    }else{
      var qtyHtml = "";
      if(qty>0){
        qtyHtml = '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\''+dish.id+'\',-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span class="qty">'+qty+'</span>';
      }
      actionHtml = qtyHtml + '<button class="qty-btn add" onclick="event.stopPropagation();updateQty(\''+dish.id+'\',1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>';
    }
    dishesHtml += '<div class="dish" onclick="openDetail(\''+dish.id+'\')"><div class="dish-img" style="background:'+dish.bg+'"><span style="font-size:32px">'+dish.icon+'</span></div><div class="dish-info"><div class="dish-name">'+dish.name+'</div>'+pregBadge(dish)+subHtml+'</div><div class="dish-actions">'+actionHtml+'</div></div>';
  }
  menuEl.innerHTML = titleHtml + dishesHtml;
}

function updateQty(dishId, delta){
  var current = state.cart[dishId] || 0;
  var next = current + delta;
  if(next<=0){ delete state.cart[dishId]; } else { state.cart[dishId] = next; }
  renderDishes();
  updateCart();
  if(state.modalDishId===dishId){ updateModalQty(); }
}

function openDetail(dishId){
  var dish = findDish(dishId);
  if(!dish) return;
  state.modalDishId = dishId;
  modalTitle.textContent = dish.name;
  var qty = state.cart[dishId] || 0;
  var qtyHtml = qty>0 ? '<span style="color:#e74c3c;font-weight:600">已选 '+qty+' 份</span>' : '<span style="color:#999">未选</span>';
  var stepsHtml = "";
  for(var i=0;i<dish.steps.length;i++){
    stepsHtml += '<div class="modal-step"><div class="modal-step-num">'+(i+1)+'</div><div>'+dish.steps[i]+'</div></div>';
  }
  modalBody.innerHTML = '<div class="modal-img" style="background:'+dish.bg+'"><span style="font-size:80px">'+dish.icon+'</span></div><div style="margin-bottom:8px">'+qtyHtml+'</div>'+pregBadge(dish,true)+(dish.reason?'<div style="font-size:13px;color:#777;line-height:1.6;margin-bottom:14px">'+dish.reason+'</div>':'')+'<div class="modal-section"><div class="modal-section-title">食材</div><div class="modal-ingredients">'+dish.ingredients+'</div></div><div class="modal-section"><div class="modal-section-title">做法步骤</div>'+stepsHtml+'</div>';
  modalOverlay.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeDetail(e){
  if(e && e.target!==modalOverlay) return;
  modalOverlay.classList.remove("show");
  document.body.style.overflow = "";
  state.modalDishId = null;
}

function modalAdd(){
  if(state.modalDishId){ updateQty(state.modalDishId, 1); updateModalQty(); }
}

function updateModalQty(){
  if(!state.modalDishId) return;
  var qty = state.cart[state.modalDishId] || 0;
  var span = modalBody.querySelector('div[style*="margin-bottom:16px"]');
  if(span){ span.innerHTML = qty>0 ? '<span style="color:#e74c3c;font-weight:600">已选 '+qty+' 份</span>' : '<span style="color:#999">未选</span>'; }
}

function updateCart(){
  var totalQty = 0;
  for(var k in state.cart){ totalQty += state.cart[k]; }
  if(totalQty>0){
    cartTabBadge.style.display = "flex";
    cartTabBadge.textContent = totalQty;
  }else{
    cartTabBadge.style.display = "none";
  }
  if(state.view==="cart") renderCart();
}

function renderCart(){
  var list = document.getElementById("cartList");
  var ids = [];
  for(var k in state.cart){ ids.push(k); }
  if(!ids.length){
    list.innerHTML = '<div class="empty-state">购物车是空的<br><span style="font-size:12px">去「点菜」加几道吧</span></div>';
    return;
  }
  var totalQty = 0;
  var html = '<div class="cat-title">购物车</div>';
  for(var i=0;i<ids.length;i++){
    var dish = findDish(ids[i]);
    if(!dish) continue;
    var qty = state.cart[ids[i]];
    totalQty += qty;
    html += '<div class="dish"><div class="dish-img" style="background:'+dish.bg+'"><span style="font-size:32px">'+dish.icon+'</span></div><div class="dish-info"><div class="dish-name">'+dish.name+'</div>'+pregBadge(dish)+'</div><div class="dish-actions"><button class="qty-btn" onclick="event.stopPropagation();updateQty(\''+dish.id+'\',-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span class="qty">'+qty+'</span><button class="qty-btn add" onclick="event.stopPropagation();updateQty(\''+dish.id+'\',1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="del-btn" onclick="event.stopPropagation();cartRemove(\''+dish.id+'\')" title="删除">🗑</button></div></div>';
  }
  html += '<div style="padding:16px 0;display:flex;gap:12px;align-items:center"><div style="flex:1;font-size:14px;color:#666">共 <b>'+totalQty+'</b> 件</div><button class="btn btn-outline" onclick="clearCart()">清空</button><button class="btn btn-primary" style="padding:8px 24px">下单</button></div>';
  list.innerHTML = html;
}

function cartRemove(id){
  delete state.cart[id];
  renderDishes();
  updateCart();
}

function findDish(id){
  for(var cat in dishesData){
    var arr = dishesData[cat];
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===id) return arr[i];
    }
  }
  return null;
}

var PREG_LABELS = {0:"\u2717 \u5b55\u671f\u7981\u6b62\u98df\u7528",1:"\u2605 \u5076\u5c14\u53ef\u4ee5\u5403",2:"\u2605\u2605 \u6bd4\u8f83\u63a8\u8350",3:"\u2605\u2605\u2605 \u63a8\u8350",4:"\u2605\u2605\u2605\u2605 \u5f3a\u70c8\u63a8\u8350",5:"\u2605\u2605\u2605\u2605\u2605 \u5fc5\u987b\u8865\u5145"};
function pregBadge(dish, big){
  if(dish.preg===undefined || dish.preg===null) return "";
  var cls = dish.preg===0 ? "preg-badge preg-x" : "preg-badge preg-star";
  var style = big ? ' style="font-size:13px;padding:4px 12px;margin:0 0 4px"' : "";
  return '<div><span class="'+cls+'"'+style+'>'+PREG_LABELS[dish.preg]+'</span></div>';
}

var GUIDE_SECTIONS = [
  {icon:"🌱", title:"孕早期（1-12周）· 你在这里",
   points:["重点补叶酸：清炒菠菜、蒜蓉西兰花、清炒豌豆尖、蒜蓉油麦菜","孕吐期吃温和易消化的：小米粥、虾仁蒸蛋、番茄炒蛋","补铁补蛋白：番茄牛腩汤、鲫鱼豆腐汤"],
   avoid:"严格避免：酒精、生食/半生食、山楂、当归等活血药材、皮蛋、螃蟹、咖啡因过量",
   note:"继续每天补充叶酸片；孕吐严重就少食多餐，不必强迫自己吃太油"},
  {icon:"🌿", title:"孕中期（13-27周）",
   points:["补铁防贫血：番茄牛腩汤、跷脚牛肉（内脏仍要限量）","补钙：鲫鱼豆腐汤、牛奶燕麦粥、紫菜蛋花汤","补DHA：清蒸鲈鱼、白灼虾、清蒸鳕鱼"],
   avoid:"24-28周做糖耐检查，开始严格控糖：少精制主食、戒含糖饮料",
   note:"食欲变好也要控量，体重每周增长约0.3-0.5kg为宜"},
  {icon:"🌳", title:"孕晚期（28周后）",
   points:["控糖控盐防水肿：白油冬瓜、凉拌黄瓜、蒸南瓜","优质蛋白：虾仁蒸蛋、清蒸鲈鱼、竹荪鸡汤","纤维防便秘：蒜蓉油麦菜、蒸红薯、凉拌木耳（适量）"],
   avoid:"继续控糖；少盐防水肿；不吃生冷食物",
   note:"少量多餐减轻胃部压迫；每天坚持数胎动"}
];
function renderGuide(){
  var html = "";
  for(var i=0;i<GUIDE_SECTIONS.length;i++){
    var g = GUIDE_SECTIONS[i];
    var pts = "";
    for(var j=0;j<g.points.length;j++){ pts += '<div class="guide-item">· '+g.points[j]+'</div>'; }
    html += '<div class="guide-card"><div class="guide-title">'+g.icon+' '+g.title+'</div><div class="guide-sub">推荐吃</div>'+pts+'<div class="guide-sub guide-warn">注意</div><div class="guide-item guide-warn">'+g.avoid+'</div><div class="guide-sub">小贴士</div><div class="guide-item">'+g.note+'</div></div>';
  }
  menuEl.innerHTML = html;
}

/* 添加菜品时根据食材自动评级 */
function autoRate(text){
  if(/皮蛋|松花蛋/.test(text)) return [0,"自动评级：含皮蛋，有铅污染和李斯特菌风险，孕期禁食"];
  if(/当归|红花|麝香|益母草|三七|藏红花/.test(text)) return [0,"自动评级：含活血类药材，孕期禁用（遵医嘱）"];
  if(/醪糟|酒酿|啤酒|白酒|红酒|黄酒|果酒/.test(text)) return [0,"自动评级：含酒精，孕期全程禁止"];
  if(/刺身|生鱼片|生腌|溏心|三分熟|五分熟|七分熟/.test(text)) return [0,"自动评级：生食/半生食有李斯特菌、弓形虫风险，孕期禁食"];
  if(/山楂|桂圆|薏米|马齿苋|甲鱼|螃蟹|大闸蟹/.test(text)) return [1,"自动评级：含山楂/桂圆/蟹等孕早期慎食食材，偶尔少量"];
  if(/咖啡|浓茶|奶茶|可乐|可可/.test(text)) return [1,"自动评级：含咖啡因，每天总量需控制在200mg内"];
  if(/肝|腰花|脑花|肥肠/.test(text)) return [1,"自动评级：动物内脏维生素A过量有致畸风险，偶尔少量"];
  if(/腊肉|香肠|火腿|午餐肉|培根|咸菜|泡菜|酸菜|腌/.test(text)) return [1,"自动评级：腌制加工食品，高盐+亚硝酸盐风险，偶尔少量"];
  if(/糯米|红糖|冰糖|白糖|糖醋|蛋糕|糍粑|汤圆|蜂蜜/.test(text)) return [1,"自动评级：高糖高升糖，多囊控糖需严格限量"];
  if(/油炸|炸鸡|烧烤|烤串|火锅|麻辣|红油|肥肉|五花肉|回锅/.test(text)) return [1,"自动评级：高油重辣或熏烤，孕早期及控糖需限量"];
  if(/米饭|面条|粉丝|粉条|凉粉|土豆|芋头|馒头|面包/.test(text)) return [1,"自动评级：精制碳水/高升糖食材，控糖需控量"];
  if(/西兰花|豌豆尖|菠菜|芦笋|油麦菜|红苕尖|红薯叶/.test(text)) return [4,"自动评级：深绿叶菜，叶酸+纤维+低升糖，多囊孕妈优选"];
  if(/豆腐|豆浆|鲈鱼|鳕鱼|三文鱼|虾|牛肉|瘦肉|鸡肉|鸡蛋|牛奶|酸奶|燕麦/.test(text)) return [3,"自动评级：优质蛋白/低升糖食材，推荐常吃；肉类务必全熟"];
  return [2,"自动评级：家常可吃，注意少油少糖、彻底煮熟、控制分量"];
}

function togglePregGroup(r){
  state.collapsed[r] = !state.collapsed[r];
  renderByPreg();
}

function renderByPreg(){
  var groups = {5:[],4:[],3:[],2:[],1:[],0:[]};
  for(var cat in dishesData){
    var arr = dishesData[cat];
    for(var i=0;i<arr.length;i++){
      var d = arr[i];
      if(d.preg!==undefined && d.preg!==null && groups[d.preg]) groups[d.preg].push(d);
    }
  }
  var html = "";
  var order = [5,4,3,2,1,0];
  for(var k=0;k<order.length;k++){
    var r = order[k];
    var list = groups[r];
    if(!list.length) continue;
    var headCls = r===0 ? "preg-badge preg-x" : "preg-badge preg-star";
    var isCollapsed = !!state.collapsed[r];
    html += '<div class="cat-title" style="cursor:pointer" onclick="togglePregGroup('+r+')"><span class="'+headCls+'" style="font-size:12px;padding:2px 10px">'+PREG_LABELS[r]+'</span><span style="color:#999;font-weight:400">('+list.length+')</span><span style="margin-left:auto;color:#999;font-size:12px">'+(isCollapsed?'展开 ▸':'收起 ▾')+'</span></div>';
    if(isCollapsed) continue;
    for(var i=0;i<list.length;i++){
      var dish = list[i];
      var qty = state.cart[dish.id] || 0;
      var subHtml = dish.reason ? '<div class="dish-sub">'+dish.reason+'</div>' : '';
      var actionHtml = "";
      if(state.managing){
        actionHtml = '<button class="del-btn" onclick="event.stopPropagation();deleteDish(\''+dish.id+'\')" title="删除">🗑</button>';
      }else{
        var qtyHtml = "";
        if(qty>0){
          qtyHtml = '<button class="qty-btn" onclick="event.stopPropagation();updateQty(\''+dish.id+'\',-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span class="qty">'+qty+'</span>';
        }
        actionHtml = qtyHtml + '<button class="qty-btn add" onclick="event.stopPropagation();updateQty(\''+dish.id+'\',1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>';
      }
      html += '<div class="dish" onclick="openDetail(\''+dish.id+'\')"><div class="dish-img" style="background:'+dish.bg+'"><span style="font-size:32px">'+dish.icon+'</span></div><div class="dish-info"><div class="dish-name">'+dish.name+'</div>'+subHtml+'</div><div class="dish-actions">'+actionHtml+'</div></div>';
    }
  }
  menuEl.innerHTML = html || '<div class="empty-state">暂无菜品</div>';
}

/* ---- 管理菜谱 ---- */
function toggleManage(){
  state.managing = !state.managing;
  manageBtn.textContent = state.managing ? "完成" : "管理菜谱";
  manageBtn.className = state.managing ? "btn btn-primary" : "btn btn-outline";
  renderDishes();
}

function deleteDish(id){
  var dish = findDish(id);
  if(!dish) return;
  if(!confirm("确定删除「"+dish.name+"」吗？")) return;
  for(var cat in dishesData){
    var arr = dishesData[cat];
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===id){ arr.splice(i,1); break; }
    }
  }
  delete state.cart[id];
  saveData();
  renderDishes();
  updateCart();
}

/* ---- 添加菜谱 ---- */
function openAdd(){
  var sel = document.getElementById("addCat");
  var html = "";
  for(var i=0;i<categories.length;i++){
    if(categories[i].id==="bypreg"||categories[i].id==="guide") continue;
    html += '<option value="'+categories[i].id+'">'+categories[i].name+'</option>';
  }
  sel.innerHTML = html;
  sel.value = state.currentCategory;
  document.getElementById("addName").value = "";
  document.getElementById("addIngredients").value = "";
  document.getElementById("addSteps").value = "";
  addOverlay.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeAdd(e){
  if(e && e.target!==addOverlay) return;
  addOverlay.classList.remove("show");
  document.body.style.overflow = "";
}

function saveDish(){
  var name = document.getElementById("addName").value.trim();
  var cat = document.getElementById("addCat").value;
  var ingredients = document.getElementById("addIngredients").value.trim();
  var stepsRaw = document.getElementById("addSteps").value.trim();
  if(!name){ alert("请填写菜名"); return; }
  var steps = [];
  if(stepsRaw){
    var lines = stepsRaw.split("\n");
    for(var i=0;i<lines.length;i++){
      var t = lines[i].trim();
      if(t) steps.push(t);
    }
  }
  if(!steps.length) steps = ["暂无步骤"];
  var rate = autoRate(name + " " + ingredients + " " + stepsRaw);
  var dish = {
    id: "u" + Date.now(),
    name: name,
    icon: "🍽️",
    bg: "#f5f5f5",
    ingredients: ingredients || "暂无食材信息",
    steps: steps,
    preg: rate[0],
    reason: rate[1]
  };
  if(!dishesData[cat]) dishesData[cat] = [];
  dishesData[cat].push(dish);
  saveData();
  closeAdd();
  state.currentCategory = cat;
  state.searchQuery = "";
  searchInput.value = "";
  renderCategories();
  renderDishes();
}

/* ---- 底部标签切换 ---- */
function setView(view){
  state.view = view;
  var tabs = document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("active", tabs[i].getAttribute("data-view")===view);
  }
  document.getElementById("menuView").style.display = view==="menu" ? "" : "none";
  document.getElementById("meView").style.display = view==="me" ? "" : "none";
  document.getElementById("cartView").style.display = view==="cart" ? "" : "none";
  if(view==="me") renderMe();
  if(view==="cart") renderCart();
}

function renderMe(){
  var total = 0;
  for(var k in dishesData){ total += dishesData[k].length; }
  var cartQty = 0;
  for(var k2 in state.cart){ cartQty += state.cart[k2]; }
  document.getElementById("statDishes").textContent = total;
  var realCats = 0;
  for(var ci=0;ci<categories.length;ci++){ if(dishesData[categories[ci].id]) realCats++; }
  document.getElementById("statCats").textContent = realCats;
  document.getElementById("statCart").textContent = cartQty;
}

function clearCart(){
  state.cart = {};
  updateCart();
  renderDishes();
  renderMe();
}

function resetData(){
  if(!confirm("恢复默认菜谱？你添加和删除的改动都会被重置。")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  dishesData = JSON.parse(JSON.stringify(DEFAULT_DATA)).dishes;
  state.cart = {};
  saveData();
  renderCategories();
  renderDishes();
  updateCart();
  renderMe();
}

/* ---- 事件绑定 ---- */
searchInput.addEventListener("input", function(e){
  state.searchQuery = e.target.value;
  renderDishes();
});

manageBtn.addEventListener("click", toggleManage);
addBtn.addEventListener("click", openAdd);

var tabs = document.querySelectorAll(".tab");
for(var i=0;i<tabs.length;i++){
  tabs[i].addEventListener("click", function(){
    setView(this.getAttribute("data-view"));
  });
}

renderCategories();
renderDishes();
updateCart();
initSync();
</script>
</body>
</html>
