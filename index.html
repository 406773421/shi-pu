<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大宝贝儿的食谱</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111;background:#f5f5f5}
  .app-wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:80px;background:#fff}
  .app-header{text-align:center;padding:16px 0 12px;font-size:18px;font-weight:600}
  .toolbar{display:flex;align-items:center;gap:8px;padding:0 16px 12px}
  .search-box{flex:1;display:flex;align-items:center;gap:8px;background:#f5f5f5;border-radius:20px;padding:8px 14px}
  .search-box input{border:none;background:transparent;outline:none;font-size:15px;width:100%;color:#111;font-family:inherit}
  .search-box input::placeholder{color:#999}
  .btn{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:opacity .15s;font-family:inherit}
  .btn:hover{opacity:.8}
  .btn-outline{background:#fff;color:#111;border-color:#e0e0e0}
  .btn-primary{background:#111;color:#fff;border-color:#111}
  .btn-danger{background:#e74c3c;color:#fff;border-color:#e74c3c}
  .main{display:flex}
  .sidebar{width:90px;background:#f8f8f8;position:sticky;top:0;align-self:flex-start;height:fit-content}
  .cat-item{padding:14px 6px;text-align:center;font-size:13px;cursor:pointer;position:relative;color:#666;transition:all .15s;line-height:1.3}
  .cat-item.active{background:#fff;color:#111;font-weight:500}
  .cat-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#111;border-radius:0 2px 2px 0}
  .cat-icon{font-size:18px;display:block;margin-bottom:4px}
  .menu{flex:1;padding:0 16px 16px;min-width:0}
  .cat-title{font-size:16px;font-weight:500;padding:12px 0 8px;display:flex;align-items:center;gap:4px;position:sticky;top:0;background:#fff;z-index:2}
  .dish{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee;align-items:center;cursor:pointer}
  .dish-img{width:76px;height:76px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f0f0f0}
  .dish-info{flex:1;min-width:0;pointer-events:none}
  .dish-name{font-size:15px;font-weight:500;margin-bottom:6px}
  .dish-sub{font-size:12px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .preg-badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-top:4px;font-weight:500}
  .preg-x{background:#fdecea;color:#e74c3c}
  .preg-star{background:#fff8e1;color:#e67e22}
  .preg-note{font-size:12px;color:#999;text-align:center;margin-top:14px;line-height:1.6}
  .guide-card{background:#f8f8f8;border-radius:12px;padding:16px;margin:12px 0}
  .guide-title{font-size:15px;font-weight:600;margin-bottom:10px}
  .guide-sub{font-size:13px;font-weight:600;color:#333;margin:10px 0 4px}
  .guide-item{font-size:13px;color:#555;line-height:1.7}
  .guide-warn{color:#c0392b}
  .order-card{background:#f8f8f8;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .order-time{font-size:13px;font-weight:600;margin-bottom:8px;color:#333}
  .order-item{font-size:13px;color:#555;line-height:1.8}
  #toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:14px;padding:10px 20px;border-radius:20px;display:none;z-index:200;white-space:nowrap}
  .dish-actions{display:flex;align-items:center;gap:6px}
  .qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111;padding:0}
  .qty-btn.add{background:#111;color:#fff;border-color:#111}
  .qty{font-size:14px;font-weight:500;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .del-btn{width:30px;height:30px;border-radius:8px;border:none;background:#fdecea;color:#e74c3c;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;padding:0}
  .cart-bar{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);z-index:20}
  .cart-icon{position:relative;color:#111;display:flex}
  .cart-badge{position:absolute;top:-5px;right:-5px;background:#e74c3c;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:500}
  .cart-info{flex:1;font-size:14px;color:#999}
  .cart-total{font-weight:500;color:#111}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:20}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#999;background:none;border:none;cursor:pointer;position:relative;padding:4px 12px;font-family:inherit}
  .tab.active{color:#111}
  .tab-badge{position:absolute;top:0;right:6px;background:#e74c3c;color:#fff;font-size:10px;padding:0 5px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:500}
  .empty-state{text-align:center;padding:40px 20px;color:#999;font-size:14px}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.show{display:flex}
  .modal-content{background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;position:relative}
  .modal-header{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .modal-title{font-size:18px;font-weight:600}
  .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f5f5f5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
  .modal-body{padding:0 20px 20px}
  .modal-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:12px;margin:16px 0}
  .modal-section{margin-bottom:20px}
  .modal-section-title{font-size:15px;font-weight:600;margin-bottom:10px;color:#333}
  .modal-ingredients{font-size:14px;line-height:1.6;color:#555;background:#f8f8f8;padding:12px 16px;border-radius:10px}
  .modal-step{display:flex;gap:12px;margin-bottom:14px;font-size:14px;line-height:1.6;color:#444}
  .modal-step-num{width:24px;height:24px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
  .modal-footer{position:sticky;bottom:0;background:#fff;padding:12px 20px 20px;border-top:1px solid #eee;display:flex;gap:12px;align-items:center}
  .form-group{margin-bottom:14px}
  .form-label{font-size:13px;font-weight:500;color:#333;margin-bottom:6px;display:block}
  .form-input,.form-select,.form-textarea{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;color:#111;outline:none;background:#fff}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#111}
  .form-textarea{resize:vertical;min-height:70px;line-height:1.5}
  .form-hint{font-size:12px;color:#999;margin-top:4px}
  .me-page{padding:0 16px 16px}
  .me-card{background:#f8f8f8;border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
  .me-avatar{font-size:48px;margin-bottom:8px}
  .me-name{font-size:17px;font-weight:600}
  .me-stats{display:flex;gap:12px;margin-bottom:16px}
  .me-stat{flex:1;background:#f8f8f8;border-radius:12px;padding:16px 8px;text-align:center}
  .me-stat-num{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .me-stat-label{font-size:12px;color:#999;margin-top:4px}
  .me-actions{display:flex;flex-direction:column;gap:10px}
  .me-actions .btn{width:100%;padding:12px}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="app-header">大宝贝儿的食谱</div>

  <div id="menuView">
    <div class="toolbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:#999;flex-shrink:0">
          <path d="M11.5 3C16.1944 3 20 6.80558 20 11.5C20 13.523 19.2933 15.381 18.1132 16.8404L21.1364 19.8636C21.4879 20.2151 21.4879 20.7849 21.1364 21.1364C20.7849 21.4879 20.2151 21.4879 19.8636 21.1364L16.8404 18.1132C15.381 19.2933 13.523 20 11.5 20C6.80558 20 3 16.1944 3 11.5C3 6.80558 6.80558 3 11.5 3ZM11.5 18.2C15.2003 18.2 18.2 15.2003 18.2 11.5C18.2 7.79969 15.2003 4.8 11.5 4.8C7.79969 4.8 4.8 7.79969 4.8 11.5C4.8 15.2003 7.79969 18.2 11.5 18.2Z" fill="currentColor"/>

      <button class="btn btn-primary" id="addBtn">添加菜谱</button>

    <div class="main">
      <aside class="sidebar" id="sidebar"></aside>
      <section class="menu" id="menu"></section>
    </div>
  </div>

  <div id="cartView" style="display:none;padding:0 16px 16px">
    <div id="cartList"></div>
  </div>

  <div id="meView" class="me-page" style="display:none">
    <div class="me-card">
      <div class="me-avatar">👶</div>
      <div class="me-name">大宝贝儿</div>

    <div class="me-stats">

      <div class="me-stat"><div class="me-stat-num" id="statCats">0</div><div class="me-stat-label">分类</div></div>
      <div class="me-stat"><div class="me-stat-num" id="statCart">0</div><div class="me-stat-label">已点份数</div></div>

    <div class="cat-title" style="padding:4px 0 10px">下单详情</div>
    <div id="orderList"></div>
    <div class="preg-note">评级按孕早期（5周+）+ 多囊控糖口径：✗ 禁止食用 ｜ ★ 偶尔可吃 ｜ ★★ 比较推荐 ｜ ★★★ 推荐 ｜ ★★★★ 强烈推荐 ｜ ★★★★★ 必须补充<br>已考虑酒精、生食/半生食、活血食材（山楂/当归等）、腌制加工食品、动物内脏（维生素A）、皮蛋含铅、咖啡因、高升糖等因素，仅供参考，具体请遵医嘱</div>
  </div>

  <nav class="tab-bar">

    <button class="tab" data-view="cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2 12h12l2-9H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="10" cy="19" r="1.5" fill="currentColor"/><circle cx="18" cy="19" r="1.5" fill="currentColor"/></svg>

      <span class="tab-badge" id="cartTabBadge" style="display:none">0</span>

    <button class="tab" data-view="me">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span>

  </nav>
</div>

<div id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeDetail(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">菜品详情</div>
      <button class="modal-close" onclick="closeDetail()">&#10005;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <div style="flex:1;font-size:14px;color:#999">选好数量后点击加入购物车</div>
      <button class="btn btn-primary" onclick="modalAdd()">加入购物车</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addOverlay" onclick="closeAdd(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">添加菜谱</div>
      <button class="modal-close" onclick="closeAdd()">&#10005;</button>
    </div>
    <div class="modal-body" style="padding-top:16px">
      <div class="form-group">
        <label class="form-label">菜名</label>
        <input class="form-input" id="addName" placeholder="例如：麻婆豆腐">
      </div>
      <div class="form-group">
        <label class="form-label">分类</label>
        <select class="form-select" id="addCat"></select>
      </div>
      <div class="form-group">
        <label class="form-label">食材</label>
        <textarea class="form-textarea" id="addIngredients" placeholder="例如：嫩豆腐1盒、牛肉末100g、豆瓣酱"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">做法步骤</label>
        <textarea class="form-textarea" id="addSteps" style="min-height:110px" placeholder="每行写一步"></textarea>
        <div class="form-hint">每行一步，保存后自动编号</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="flex:1" onclick="closeAdd()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveDish()">保存菜谱</button>
    </div>
  </div>
</div>
